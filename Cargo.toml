[package]
name = "netpulse"
version = "2.0.0"
edition = "2024"
description = "NetPulse - surveillance et analyse du reseau local"
authors = ["Les-Doubles-A"]
repository = "https://github.com/Les-Doubles-A/NetPulse"

[[bin]]
name = "NetPulse"
path = "src/main.rs"

[dependencies]
chrono = "0.4.45"
crossbeam-channel = "0.5.17"
dirs = "7.0.0"
dns-lookup = "4.0.2"
eframe = "0.37"
egui_extras = "0.37"
egui_plot = "0.38"
if-addrs = "0.15.0"
image = { version = "0.25.10", default-features = false, features = ["ico", "png"] }
notify-rust = "4.19.0"
rfd = "0.18.0"
rusqlite = { version = "0.42", features = ["bundled"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
sysinfo = "0.40.1"
ureq = "3"

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61", features = ["Win32_NetworkManagement_IpHelper", "Win32_Networking_WinSock", "Win32_Foundation", "Win32_System_Console"] }

[build-dependencies]
winresource = "0.1.34"

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 1
strip = true
panic = "abort"
